# ============================================================================
# HUB75 Clocks - Select Theme Script
# ============================================================================
# THIS IS A SCRIPT, NOT AN AUTOMATION.
#
# Import it into Home Assistant under the script: key, NOT the automation: key.
#
# Option A — dedicated script directory (recommended):
#   In configuration.yaml:
#     script: !include_dir_merge_named scripts/
#   Save this file as config/scripts/clocks_select_theme.yaml
#
# Option B — inline in a package:
#   Copy the content below directly under a "script:" key in any package YAML.
#
# After import, restart HA. The script appears under Settings → Scripts.
# automation 01_set_theme.yaml calls it via: action: script.clocks_select_theme
#
# ── How it works ──────────────────────────────────────────────────────────────
#   Reads input_select.house_bucket and input_text.clock_condition, maps them
#   to a "Bucket - Condition" theme name, and publishes to both clock topics.
#
# ── Bucket options (input_select.house_bucket) ────────────────────────────────
#   Day, Early Morning, Evening, Late Evening, Night, Away
#
# ── Condition values (input_text.clock_condition, set by 02_push_weather) ─────
#   SUNNY, CLEAR, PARTLYCLOUDY, CLOUDY, RAIN, TSTORM, SNOW, SLEET
#
# ── Theme coverage per bucket ─────────────────────────────────────────────────
#   Day          → Clear / Partly Cloudy / Cloudy / Rain / Storm / Snow / Sleet
#   Early Morning → Clear / Partly Cloudy / Rain / Snow
#                  (Cloudy→Partly Cloudy, Storm→Rain, Sleet→Rain)
#   Evening      → Clear / Partly Cloudy / Rain / Storm
#                  (Cloudy→Partly Cloudy, Snow→Rain, Sleet→Rain)
#   Late Evening  → Clear / Partly Cloudy / Rain
#                  (Cloudy→Partly Cloudy, Storm/Snow/Sleet→Rain)
#   Night        → Clear / Partly Cloudy / Cloudy / Rain / Storm / Snow / Sleet
#   Away         → Away (always, regardless of condition)
#
# ── Customize ─────────────────────────────────────────────────────────────────
#   bedroom_clock/theme/set     — bedroom clock MQTT theme topic
#   living_room_clock/theme/set — living room clock MQTT theme topic
#   (must match mqtt.client_id in each clock's config.yaml)
# ============================================================================

clocks_select_theme:
  alias: "HUB75 Clocks - Select Theme"
  description: >
    Maps input_select.house_bucket + input_text.clock_condition to a
    "Bucket - Condition" theme name and publishes it to both clocks.
  sequence:
    - variables:
        theme: >
          {% set bucket = states('input_select.house_bucket') | trim %}
          {% set raw    = states('input_text.clock_condition') | upper | trim %}

          {# Map raw MQTT condition codes to theme condition label #}
          {% set ns = namespace(cl='Clear') %}
          {% if   raw in ['CLEAR', 'SUNNY'] %}
            {% set ns.cl = 'Clear' %}
          {% elif raw == 'PARTLYCLOUDY' %}
            {% set ns.cl = 'Partly Cloudy' %}
          {% elif raw in ['CLOUDY', 'FOG', 'SMOKE', 'DUST', 'WINDY', 'EXCEPTIONAL'] %}
            {% set ns.cl = 'Cloudy' %}
          {% elif raw in ['RAIN', 'FLOOD'] %}
            {% set ns.cl = 'Rain' %}
          {% elif raw in ['TSTORM', 'HURRICANE', 'TROPICAL_STORM'] %}
            {% set ns.cl = 'Storm' %}
          {% elif raw in ['SNOW', 'BLIZZARD'] %}
            {% set ns.cl = 'Snow' %}
          {% elif raw in ['SLEET', 'ICE', 'FREEZING_RAIN', 'FREEZING_DRIZZLE'] %}
            {% set ns.cl = 'Sleet' %}
          {% endif %}
          {% set cl = ns.cl %}

          {#
            Map bucket + condition label to a theme name.
            Day and Night have full coverage (all 7 conditions).
            Other buckets have partial coverage — unmapped conditions fall back
            to the nearest available theme for that bucket.
          #}
          {% if bucket == 'Away' %}
            Away

          {% elif bucket == 'Day' %}
            Day - {{ cl }}

          {% elif bucket == 'Early Morning' %}
            {% if   cl in ['Clear', 'Partly Cloudy', 'Rain', 'Snow'] %}
              Early Morning - {{ cl }}
            {% elif cl == 'Cloudy' %}
              Early Morning - Partly Cloudy
            {% elif cl in ['Storm', 'Sleet'] %}
              Early Morning - Rain
            {% else %}
              Early Morning - Clear
            {% endif %}

          {% elif bucket == 'Evening' %}
            {% if   cl in ['Clear', 'Partly Cloudy', 'Rain', 'Storm'] %}
              Evening - {{ cl }}
            {% elif cl == 'Cloudy' %}
              Evening - Partly Cloudy
            {% elif cl in ['Snow', 'Sleet'] %}
              Evening - Rain
            {% else %}
              Evening - Clear
            {% endif %}

          {% elif bucket == 'Late Evening' %}
            {% if   cl in ['Clear', 'Partly Cloudy', 'Rain'] %}
              Late Evening - {{ cl }}
            {% elif cl == 'Cloudy' %}
              Late Evening - Partly Cloudy
            {% elif cl in ['Storm', 'Snow', 'Sleet'] %}
              Late Evening - Rain
            {% else %}
              Late Evening - Clear
            {% endif %}

          {% elif bucket == 'Night' %}
            Night - {{ cl }}

          {% else %}
            Day - Clear
          {% endif %}

    # Publish resolved theme name to both clocks
    - action: mqtt.publish
      data:
        topic: bedroom_clock/theme/set
        payload: "{{ theme | trim }}"

    - action: mqtt.publish
      data:
        topic: living_room_clock/theme/set
        payload: "{{ theme | trim }}"
