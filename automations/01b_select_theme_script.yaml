# ============================================================================
# HUB75 Clock - Optional Select Theme Script
# ============================================================================
# THIS IS A SCRIPT, NOT AN AUTOMATION.
#
# Import it into Home Assistant under the script: key, NOT the automation: key.
#
# Option A - dedicated script directory:
#   In configuration.yaml:
#     script: !include_dir_merge_named scripts/
#   Save this file as config/scripts/clocks_select_theme.yaml
#
# Option B - inline in a package:
#   Copy the content below directly under a "script:" key in any package YAML.
#
# After import, restart HA. The script appears under Settings -> Scripts.
# automation 01_set_theme.yaml calls it via: action: script.clocks_select_theme
#
# How it works:
#   Reads optional helpers input_select.clock_daypart and
#   input_text.clock_condition, maps them to a theme name, and publishes to one
#   clock topic. Duplicate the mqtt.publish action for additional clocks.
#
# Optional daypart values:
#   Day, Early Morning, Evening, Late Evening, Night, Away
#
# Optional condition values:
#   SUNNY, CLEAR, PARTLYCLOUDY, CLOUDY, RAIN, TSTORM, SNOW, SLEET
#
# Customize:
#   YOUR_CLOCK_CLIENT_ID/theme/set must match mqtt.client_id in config.yaml.
# ============================================================================

clocks_select_theme:
  alias: "HUB75 Clock - Select Theme"
  description: >
    Maps optional daypart + weather condition helpers to a theme name and
    publishes it to the clock.
  sequence:
    - variables:
        theme: >
          {% set daypart = states('input_select.clock_daypart') | trim %}
          {% set raw = states('input_text.clock_condition') | upper | trim %}

          {% set ns = namespace(cl='Clear') %}
          {% if raw in ['CLEAR', 'SUNNY'] %}
            {% set ns.cl = 'Clear' %}
          {% elif raw == 'PARTLYCLOUDY' %}
            {% set ns.cl = 'Partly Cloudy' %}
          {% elif raw in ['CLOUDY', 'FOG', 'SMOKE', 'DUST', 'WINDY', 'EXCEPTIONAL'] %}
            {% set ns.cl = 'Cloudy' %}
          {% elif raw in ['RAIN', 'FLOOD'] %}
            {% set ns.cl = 'Rain' %}
          {% elif raw in ['TSTORM', 'HURRICANE', 'TROPICAL_STORM'] %}
            {% set ns.cl = 'Storm' %}
          {% elif raw in ['SNOW', 'BLIZZARD'] %}
            {% set ns.cl = 'Snow' %}
          {% elif raw in ['SLEET', 'ICE', 'FREEZING_RAIN', 'FREEZING_DRIZZLE'] %}
            {% set ns.cl = 'Sleet' %}
          {% endif %}
          {% set cl = ns.cl %}

          {% if daypart == 'Away' %}
            Away
          {% elif daypart == 'Day' %}
            Day - {{ cl }}
          {% elif daypart == 'Early Morning' %}
            {% if cl in ['Clear', 'Partly Cloudy', 'Rain', 'Snow'] %}
              Early Morning - {{ cl }}
            {% elif cl == 'Cloudy' %}
              Early Morning - Partly Cloudy
            {% elif cl in ['Storm', 'Sleet'] %}
              Early Morning - Rain
            {% else %}
              Early Morning - Clear
            {% endif %}
          {% elif daypart == 'Evening' %}
            {% if cl in ['Clear', 'Partly Cloudy', 'Rain', 'Storm'] %}
              Evening - {{ cl }}
            {% elif cl == 'Cloudy' %}
              Evening - Partly Cloudy
            {% elif cl in ['Snow', 'Sleet'] %}
              Evening - Rain
            {% else %}
              Evening - Clear
            {% endif %}
          {% elif daypart == 'Late Evening' %}
            {% if cl in ['Clear', 'Partly Cloudy', 'Rain'] %}
              Late Evening - {{ cl }}
            {% elif cl == 'Cloudy' %}
              Late Evening - Partly Cloudy
            {% elif cl in ['Storm', 'Snow', 'Sleet'] %}
              Late Evening - Rain
            {% else %}
              Late Evening - Clear
            {% endif %}
          {% elif daypart == 'Night' %}
            Night - {{ cl }}
          {% else %}
            Day - Clear
          {% endif %}

    - action: mqtt.publish
      data:
        topic: YOUR_CLOCK_CLIENT_ID/theme/set
        payload: "{{ theme | trim }}"
