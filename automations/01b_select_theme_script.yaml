# ============================================================================
# HUB75 Clocks - Select Theme Script
# ============================================================================
# THIS IS A SCRIPT, NOT AN AUTOMATION.
#
# Import it into Home Assistant under the script: key, NOT the automation: key.
#
# Option A — dedicated script file (recommended):
#   In configuration.yaml:
#     script: !include_dir_merge_named scripts/
#   Save this file as config/scripts/clocks_select_theme.yaml
#
# Option B — inline in a package:
#   Add the contents below directly under a "script:" key in any package YAML.
#
# After import, restart HA. The script appears under Settings → Scripts.
# The automation 01_set_theme.yaml calls it via action: script.clocks_select_theme.
#
# ── How it works ──────────────────────────────────────────────────────────────
#   1. Reads input_select.house_bucket (time-of-day category)
#   2. Reads input_text.clock_condition (weather condition set by 02_push_weather)
#   3. Maps the combination to the best-fit theme name
#   4. Publishes the theme name to both clock MQTT topics
#
# ── Night-side buckets ────────────────────────────────────────────────────────
#   Night, Late Evening → prefer dark themes (Night, Late Evening, Rainy Night,
#   Stormy Night, Snowy Night)
#
# ── Day-side buckets ──────────────────────────────────────────────────────────
#   Day, Sunrise, Sunset, after_sunset, Away → prefer lighter themes
#   Away always maps to the Away theme regardless of condition.
#
# ── Available themes ──────────────────────────────────────────────────────────
#   Daytime:   Day, Sunrise, Sunset, Away
#   Evening:   Late Evening
#   Night:     Night
#   Rain:      Rainy Day, Rainy Night
#   Storm:     Stormy Day, Stormy Night
#   Snow:      Snowy Day, Snowy Night
#   Sleet:     Sleety Day
#
# ── Customize ─────────────────────────────────────────────────────────────────
#   bedroom_clock/theme/set     — bedroom clock per-device theme topic
#   living_room_clock/theme/set — living room clock per-device theme topic
#   (These must match mqtt.client_id set in each clock's config.yaml)
# ============================================================================

clocks_select_theme:
  alias: "HUB75 Clocks - Select Theme"
  description: >
    Picks the best theme for both clocks from house bucket + weather condition,
    then publishes it to each clock's MQTT theme topic.
  sequence:
    - variables:
        theme: >
          {% set bucket    = states('input_select.house_bucket') %}
          {% set condition = states('input_text.clock_condition') | upper | trim %}
          {% set night_side = bucket in ['Night', 'Late Evening'] %}

          {% if bucket == 'Away' %}
            Away

          {% elif night_side %}
            {% if   condition == 'TSTORM' %}Stormy Night
            {% elif condition == 'RAIN'   %}Rainy Night
            {% elif condition == 'SNOW'   %}Snowy Night
            {% elif condition == 'SLEET'  %}Rainy Night
            {% elif condition == 'ICE'    %}Rainy Night
            {% elif bucket    == 'Late Evening' %}Late Evening
            {% else %}Night
            {% endif %}

          {% else %}
            {% if   condition == 'TSTORM' %}Stormy Day
            {% elif condition == 'RAIN'   %}Rainy Day
            {% elif condition == 'SNOW'   %}Snowy Day
            {% elif condition == 'SLEET'  %}Sleety Day
            {% elif condition == 'ICE'    %}Sleety Day
            {% elif bucket in ['Sunset', 'after_sunset', 'After Sunset'] %}Sunset
            {% elif bucket == 'Sunrise'   %}Sunrise
            {% elif bucket == 'Late Evening' %}Late Evening
            {% else %}Day
            {% endif %}

          {% endif %}

    # Publish theme to bedroom clock
    - action: mqtt.publish
      data:
        topic: bedroom_clock/theme/set
        payload: "{{ theme | trim }}"

    # Publish theme to living room clock
    - action: mqtt.publish
      data:
        topic: living_room_clock/theme/set
        payload: "{{ theme | trim }}"
