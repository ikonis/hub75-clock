# ============================================================================
# HUB75 Clock - Optional Theme and Brightness Example
# ============================================================================
# This is an example, not required clock plumbing.
#
# It sets brightness and calls script.clocks_select_theme whenever the sun
# rises/sets, HA starts, the clock comes online, or the optional weather
# condition helper changes.
#
# Customize these before use:
#   input_select.clock_daypart          optional helper: Day, Evening, Night, Away
#   input_text.clock_condition          optional helper updated by 02_push_weather
#   number.YOUR_CLOCK_CLIENT_ID_brightness
#   binary_sensor.YOUR_CLOCK_CLIENT_ID_online
#   script.clocks_select_theme          see 01b_select_theme_script.yaml
#
# Duplicate the brightness target and online trigger for additional clocks.
# ============================================================================

alias: "HUB75 Clock - Optional Theme and Brightness"
description: >
  Example automation that sets brightness and calls clocks_select_theme.
mode: queued
max: 2
triggers:
  - trigger: sun
    event: sunrise
    id: sunrise
  - trigger: sun
    event: sunset
    id: sunset
  - trigger: state
    entity_id: input_select.clock_daypart
    id: daypart_change
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: state
    entity_id: binary_sensor.YOUR_CLOCK_CLIENT_ID_online
    to: "on"
    id: clock_online
  - trigger: state
    entity_id: input_text.clock_condition
    id: condition_change
actions:
  - variables:
      daypart: "{{ states('input_select.clock_daypart') }}"
      after_sunset: "{{ is_state('sun.sun', 'below_horizon') }}"
      brightness: >
        {% if daypart == 'Away' %}1
        {% elif daypart == 'Night' %}5
        {% elif after_sunset %}30
        {% else %}60{% endif %}
  - action: number.set_value
    target:
      entity_id: number.YOUR_CLOCK_CLIENT_ID_brightness
    data:
      value: "{{ brightness }}"
  - action: script.clocks_select_theme
