# ============================================================================
# HUB75 Clocks - Set Theme and Brightness
# ============================================================================
# Fires whenever the house bucket changes, the sun rises/sets, a clock comes
# online, or the mapped weather condition changes. Sets brightness on both
# clocks directly, then calls script.clocks_select_theme to pick the theme.
#
# ── Required helpers ──────────────────────────────────────────────────────────
#   input_select.house_bucket  — your time-of-day bucket selector
#     Suggested options: Day, Sunrise, Sunset, after_sunset, Late Evening,
#                        Night, Away
#   input_text.clock_condition — set by automation 02_push_weather.yaml
#     Values: CLEAR, SUNNY, PARTLYCLOUDY, CLOUDY, RAIN, SNOW, SLEET, TSTORM,
#             ICE, and aliases resolved by the clock (BLIZZARD, HURRICANE, …)
#
# ── Required script ───────────────────────────────────────────────────────────
#   script.clocks_select_theme — defined in 01b_select_theme_script.yaml
#   Import it as a script in HA (not as an automation). See that file for
#   instructions.
#
# ── Customize ─────────────────────────────────────────────────────────────────
#   number.bedroom_clock_brightness     — auto-discovered via MQTT Discovery
#   number.living_room_clock_brightness — auto-discovered via MQTT Discovery
#   Brightness values below: Away=1, Night=5, after_sunset=30, all others=60
# ============================================================================

alias: "HUB75 Clocks - Set Theme and Brightness"
description: >
  Sets brightness on both clocks and calls clocks_select_theme to pick the
  right theme based on house bucket and current weather condition.
mode: queued
max: 2
triggers:
  - trigger: sun
    event: sunrise
    id: sunrise
  - trigger: sun
    event: sunset
    id: sunset
  - trigger: state
    entity_id: input_select.house_bucket
    id: bucket_change
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: state
    entity_id: binary_sensor.bedroom_clock_online
    to: "on"
    id: bedroom_online
  - trigger: state
    entity_id: binary_sensor.living_room_clock_online
    to: "on"
    id: living_room_online
  - trigger: state
    entity_id: input_text.clock_condition
    id: condition_change
actions:
  - variables:
      bucket: "{{ states('input_select.house_bucket') }}"
      after_sunset: "{{ is_state('sun.sun', 'below_horizon') }}"
      brightness: >
        {% if bucket == 'Away' %}1
        {% elif bucket == 'Night' %}5
        {% elif after_sunset %}30
        {% else %}60{% endif %}
  - action: number.set_value
    target:
      entity_id:
        - number.bedroom_clock_brightness
        - number.living_room_clock_brightness
    data:
      value: "{{ brightness }}"
  - action: script.clocks_select_theme
