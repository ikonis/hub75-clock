# ============================================================================
# HUB75 Clock - Optional Online / Offline Notification Example
# ============================================================================
# Sends a mobile notification if a clock goes offline for more than 5 minutes.
# Duplicate the trigger if you have more than one clock.
#
# The binary_sensor entity is created automatically by MQTT Discovery. The
# entity ID is derived from the clock's mqtt.client_id in config.yaml:
#   binary_sensor.{client_id}_online
#
# Customize:
#   binary_sensor.YOUR_CLOCK_CLIENT_ID_online  clock online sensor
#   notify.YOUR_PHONE                          your mobile app notify service
# ============================================================================

alias: "HUB75 Clock - Offline Alert"
description: Notifies if the clock goes offline for more than 5 minutes.
mode: parallel
max: 2
triggers:
  - trigger: state
    entity_id: binary_sensor.YOUR_CLOCK_CLIENT_ID_online
    to: "off"
    for:
      minutes: 5
    id: clock_offline
actions:
  - variables:
      clock_name: "HUB75 Clock"
  - action: notify.YOUR_PHONE
    data:
      title: "HUB75 Clock Offline"
      message: "{{ clock_name }} has been unreachable for 5 minutes."
