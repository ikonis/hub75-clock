<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUB75 Sprite Builder</title>
<style>
:root{--bg:#09090e;--bg2:#11111a;--bg3:#181826;--bg4:#0d0d18;--border:#252538;--border2:#32324e;--text:#c0c0d4;--dim:#686884;--accent:#4a80ff;--danger:#ff4466;--ok:#66c080;--r:3px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:12px/1.45 Segoe UI,system-ui,sans-serif;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.title{font-size:13px;font-weight:600;color:var(--accent)}
.hdr-btns,.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn,select,input{border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--text);font:12px Segoe UI,system-ui,sans-serif}
.btn{padding:5px 10px;cursor:pointer}.btn:hover{background:var(--border)}.btn-p{background:#1e3a80;border-color:var(--accent)}
select,input[type=text],input[type=number]{padding:5px 7px;outline:none}input[type=color]{width:38px;height:27px;padding:2px}
#sprite-select{min-width:190px}.status{color:var(--dim);min-width:80px}
.body{display:grid;grid-template-columns:300px 1fr 360px;min-height:0;flex:1}
.panel{overflow:auto;background:var(--bg2);border-right:1px solid var(--border)}.panel.right{border-left:1px solid var(--border);border-right:0}
.sec{border-bottom:1px solid var(--border)}.sec-h{padding:7px 10px;background:var(--bg3);font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);font-weight:600}
.sec-b{padding:10px;display:flex;flex-direction:column;gap:8px}
.f{display:flex;align-items:center;gap:7px}.f label{flex:0 0 82px;color:var(--dim);font-size:11px}.f input,.f select{min-width:0;flex:1}
.swatches{display:grid;grid-template-columns:repeat(6,28px);gap:6px}.sw{width:28px;height:28px;border:1px solid var(--border2);border-radius:var(--r);cursor:pointer}.sw.active{outline:2px solid var(--accent)}
.stage{overflow:auto;display:flex;align-items:center;justify-content:center;padding:18px;background:var(--bg)}
#grid{display:grid;gap:1px;padding:8px;background:#05050a;border:1px solid var(--border2)}
.cell{width:24px;height:24px;border:1px solid #171727;background:#101018;cursor:crosshair}
.cell.empty{background-image:linear-gradient(45deg,#111 25%,transparent 25%),linear-gradient(-45deg,#111 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#111 75%),linear-gradient(-45deg,transparent 75%,#111 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0}
.preview-wrap{display:flex;justify-content:center;padding:8px;background:var(--bg4);border:1px solid var(--border)}
#preview{image-rendering:pixelated;width:256px;height:128px;border:1px solid var(--border2);background:#020005}
#json-out{width:100%;min-height:300px;flex:1;background:var(--bg4);color:#7ab0ff;border:0;padding:9px;font:11px/1.5 Consolas,monospace;resize:none;outline:none}
.hint{color:var(--dim);font-size:11px}.err{color:var(--danger)}.ok{color:var(--ok)}
</style>
</head>
<body>
<div class="hdr">
  <span class="title">HUB75 Sprite Builder</span>
  <div class="hdr-btns">
    <select id="sprite-select"></select>
    <button class="btn" id="btn-new">New</button>
    <button class="btn btn-p" id="btn-save">Save</button>
    <button class="btn" id="btn-save-as">Save As</button>
    <a class="btn" href="/theme-builder.html">Themes</a>
    <span class="status" id="status"></span>
  </div>
</div>
<div class="body">
  <div class="panel">
    <div class="sec">
      <div class="sec-h">Sprite</div>
      <div class="sec-b">
        <div class="f"><label>Name</label><input id="i-name" type="text" value="new_sprite"></div>
        <div class="f"><label>Width</label><input id="i-width" type="number" min="1" max="32" value="8"></div>
        <div class="f"><label>Height</label><input id="i-height" type="number" min="1" max="25" value="8"></div>
        <div class="f"><label>Motion</label><select id="i-motion"><option value="left">left</option><option value="right">right</option><option value="up">up</option></select></div>
        <div class="f"><label>Speed</label><input id="i-speed" type="number" min="0.05" max="5" step="0.05" value="0.5"></div>
        <button class="btn" id="btn-resize">Resize Grid</button>
      </div>
    </div>
    <div class="sec">
      <div class="sec-h">Paint</div>
      <div class="sec-b">
        <div class="row"><input type="color" id="pick" value="#dcdce6"><button class="btn" id="btn-add-color">Add</button><button class="btn" id="btn-erase">Erase</button></div>
        <div class="swatches" id="swatches"></div>
        <div class="row"><button class="btn" id="btn-clear">Clear</button><button class="btn" id="btn-fill">Fill</button></div>
        <p class="hint">Left click paints. Right click erases.</p>
      </div>
    </div>
  </div>
  <div class="stage"><div id="grid"></div></div>
  <div class="panel right">
    <div class="sec">
      <div class="sec-h">Preview</div>
      <div class="sec-b">
        <div class="preview-wrap"><canvas id="preview" width="128" height="64"></canvas></div>
        <p class="hint">Theme cameo example: {"name":"sprite","sprite":"rocket","chance_per_minute":4}</p>
      </div>
    </div>
    <div class="sec" style="height:calc(100% - 190px);display:flex;flex-direction:column">
      <div class="sec-h">JSON</div>
      <div class="sec-b" style="flex:1;min-height:0">
        <textarea id="json-out" spellcheck="false"></textarea>
        <div class="row"><button class="btn" id="btn-apply">Apply JSON</button><button class="btn" id="btn-copy">Copy</button><span id="json-status" class="hint"></span></div>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
let sprite={name:'new_sprite',width:8,height:8,motion:'left',speed:0.5,pixels:[]};
let currentFile='', selectedFile='', color='#dcdce6', erase=false, dirty=false, syncing=false;
const palette=['#dcdce6','#c8c8d2','#a0c8ff','#c83c3c','#dc4646','#ff7800','#ffd050','#bebed2','#64b4ff','#ffffff','#000000'];
const el=id=>document.getElementById(id);
const cleanName=n=>((n||'sprite').trim().replace(/[<>:"/\\|?*\x00-\x1f]+/g,'_')||'sprite');
const fileName=()=>cleanName(sprite.name)+'.json';
const blank=(name='new_sprite',w=8,h=8)=>({name,width:w,height:h,motion:'left',speed:0.5,pixels:Array.from({length:h},()=>Array.from({length:w},()=>null))});

function markDirty(v=true){dirty=v; el('status').textContent=v?'Unsaved':'Ready';}
function normHex(h){h=(h||'').replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join(''); return '#'+h.padEnd(6,'0').slice(0,6).toLowerCase();}
function syncFields(){el('i-name').value=sprite.name;el('i-width').value=sprite.width;el('i-height').value=sprite.height;el('i-motion').value=sprite.motion||'left';el('i-speed').value=sprite.speed??0.5}
function fromFields(){sprite.name=el('i-name').value||'sprite';sprite.motion=el('i-motion').value;sprite.speed=parseFloat(el('i-speed').value)||0.5}
function normalizePixels(){let rows=sprite.pixels||[];let out=[];for(let y=0;y<sprite.height;y++){let row=[];for(let x=0;x<sprite.width;x++)row.push((rows[y]||[])[x]??null);out.push(row)}sprite.pixels=out}

function buildGrid(){
  normalizePixels();
  const g=el('grid'); g.innerHTML=''; g.style.gridTemplateColumns=`repeat(${sprite.width},24px)`;
  for(let y=0;y<sprite.height;y++)for(let x=0;x<sprite.width;x++){
    const c=document.createElement('div'); c.className='cell'; c.dataset.x=x; c.dataset.y=y; paintCellStyle(c,sprite.pixels[y][x]);
    c.addEventListener('click',paint); c.addEventListener('contextmenu',e=>{e.preventDefault();sprite.pixels[y][x]=null;paintCellStyle(c,null);updateAll()});
    g.appendChild(c);
  }
}
function paintCellStyle(cell,v){cell.classList.toggle('empty',!v);cell.style.backgroundColor=v||''}
function paint(e){const x=+e.currentTarget.dataset.x,y=+e.currentTarget.dataset.y;sprite.pixels[y][x]=erase?null:color;paintCellStyle(e.currentTarget,sprite.pixels[y][x]);updateAll()}
function buildSwatches(){const w=el('swatches');w.innerHTML='';for(const p of palette){const s=document.createElement('button');s.className='sw'+(p===color?' active':'');s.style.background=p;s.title=p;s.onclick=()=>{color=p;erase=false;el('pick').value=p;buildSwatches()};w.appendChild(s)}}

function renderPreview(){
  const cv=el('preview'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#020005';ctx.fillRect(0,0,cv.width,cv.height);
  const scale=Math.max(4,Math.floor(Math.min(cv.width/(sprite.width+4),cv.height/(sprite.height+4))));
  const ox=Math.floor((cv.width-sprite.width*scale)/2),oy=Math.floor((cv.height-sprite.height*scale)/2);
  for(let y=0;y<sprite.height;y++)for(let x=0;x<sprite.width;x++){const v=sprite.pixels[y][x];if(!v)continue;ctx.fillStyle=v;ctx.fillRect(ox+x*scale,oy+y*scale,scale,scale)}
}
function buildJSON(){fromFields();normalizePixels();return JSON.stringify(sprite,null,2)}
function updateJSON(){syncing=true;el('json-out').value=buildJSON();syncing=false;el('json-status').textContent='Generated'}
function updateAll(){renderPreview();updateJSON();markDirty(true)}
function applySprite(data,dirtyState=false){sprite={...blank(),...data};sprite.width=parseInt(sprite.width)||8;sprite.height=parseInt(sprite.height)||8;normalizePixels();syncFields();buildGrid();renderPreview();updateJSON();markDirty(dirtyState)}

async function refresh(select=currentFile){const r=await fetch('/api/sprites',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'list failed');const s=el('sprite-select');s.innerHTML='';for(const f of d.sprites){const o=document.createElement('option');o.value=f;o.textContent=f;s.appendChild(o)}if(select&&d.sprites.includes(select))s.value=select;else if(d.sprites.length)s.value=d.sprites[0];selectedFile=s.value||'';el('status').textContent=d.sprites.length?`${d.sprites.length} sprites`:'No sprites'}
async function loadSprite(file){const f=file||el('sprite-select').value;if(!f)return;const r=await fetch('/api/sprite?file='+encodeURIComponent(f),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'load failed');currentFile=selectedFile=d.file;el('sprite-select').value=d.file;applySprite(d.sprite,false);el('status').textContent=`Loaded ${d.file}`}
async function saveSprite(file=''){fromFields();const f=file||currentFile||fileName();const r=await fetch('/api/sprite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:f,sprite})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'save failed');currentFile=selectedFile=d.file;await refresh(currentFile);markDirty(false);el('status').textContent=`Saved ${d.file}`}

function wire(){
  buildSwatches();
  ['i-name','i-motion','i-speed'].forEach(id=>el(id).addEventListener('input',updateAll));
  el('btn-resize').onclick=()=>{sprite.width=Math.max(1,Math.min(32,parseInt(el('i-width').value)||8));sprite.height=Math.max(1,Math.min(25,parseInt(el('i-height').value)||8));normalizePixels();buildGrid();updateAll()};
  el('pick').oninput=e=>{color=normHex(e.target.value);erase=false;buildSwatches()};
  el('btn-add-color').onclick=()=>{const c=normHex(el('pick').value);if(!palette.includes(c))palette.unshift(c);color=c;erase=false;buildSwatches()};
  el('btn-erase').onclick=()=>{erase=!erase;el('btn-erase').classList.toggle('btn-p',erase)};
  el('btn-clear').onclick=()=>{sprite.pixels=blank(sprite.name,sprite.width,sprite.height).pixels;buildGrid();updateAll()};
  el('btn-fill').onclick=()=>{for(let y=0;y<sprite.height;y++)for(let x=0;x<sprite.width;x++)sprite.pixels[y][x]=color;buildGrid();updateAll()};
  el('btn-new').onclick=()=>{if(dirty&&!confirm('Discard unsaved changes?'))return;currentFile=selectedFile='';applySprite(blank(prompt('Sprite name:','new_sprite')||'new_sprite'),true)};
  el('btn-save').onclick=()=>saveSprite().catch(e=>alert(e.message));
  el('btn-save-as').onclick=()=>{const f=prompt('Save sprite as:',currentFile||fileName());if(f)saveSprite(f.toLowerCase().endsWith('.json')?f:f+'.json').catch(e=>alert(e.message))};
  el('sprite-select').onchange=e=>{const f=e.target.value;if(dirty&&!confirm('Discard unsaved changes and load another sprite?')){if(selectedFile)e.target.value=selectedFile;else e.target.selectedIndex=-1;return}loadSprite(f).catch(err=>alert(err.message))};
  el('json-out').oninput=()=>{if(syncing)return;try{const d=JSON.parse(el('json-out').value);el('json-status').textContent='Valid edit';el('json-status').className='ok'}catch(e){el('json-status').textContent=e.message;el('json-status').className='err'}};
  el('btn-apply').onclick=()=>{try{applySprite(JSON.parse(el('json-out').value),true)}catch(e){alert(e.message)}};
  el('btn-copy').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(el('json-out').value);
}
wire();applySprite(sprite,false);refresh().catch(()=>el('status').textContent='Offline');
</script>
</body>
</html>
