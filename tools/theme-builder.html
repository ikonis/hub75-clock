<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUB75 Clock Theme Builder</title>
<style>
:root {
  --bg: #0f0f14;
  --bg2: #1b1b22;
  --bg3: #24242d;
  --bg4: #14141c;
  --tab: #191920;
  --tab-active: #2b2b34;
  --border: #2f2f3a;
  --border2: #41414f;
  --text: #d0d0dc;
  --dim: #858596;
  --accent: #7aa2f7;
  --accent2: #30343d;
  --danger: #ff5f78;
  --ok: #7bd88f;
  --r: 4px;
  --fs: 12px;
  --sidebar: 320px;
  --field-h: 28px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.45 'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column}
/* Header */
.hdr{height:42px;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
.hdr-title{width:calc(var(--sidebar) - 22px);font-size:13px;font-weight:600;color:#a8c7ff;white-space:nowrap;padding:0 0 9px;flex:0 0 calc(var(--sidebar) - 22px)}
.hdr-btns,.row,.tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tabs{display:flex;align-items:flex-end;gap:2px;flex-wrap:wrap;margin:0 4px -1px 0;flex:0 0 auto}
.tab{height:36px;padding:9px 16px 7px;text-decoration:none;border-radius:9px 9px 0 0;background:var(--tab);border-color:var(--border);border-bottom-color:var(--border);color:#a8a8b8}
.tab:hover{background:#23232c}
.tab.active{background:var(--tab-active);border-color:var(--border2);border-bottom-color:var(--tab-active);color:#f3f3f8}
.server-only{display:none}
.server-mode .server-only{display:flex}
select,input{border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--text);font:12px 'Segoe UI',system-ui,sans-serif}
select,input[type=text],input[type=number]{height:var(--field-h);padding:5px 7px;outline:none}
input[type=color]{width:38px;height:var(--field-h);padding:2px}
input[type=range]{accent-color:var(--accent)}
#server-theme-select{height:var(--field-h);padding:5px 7px;outline:none;min-width:190px;max-width:280px}
#server-theme-select:focus{border-color:var(--accent)}
#server-status{align-items:center;color:var(--dim);font-size:11px;min-width:72px}
.dirty #server-status::after{content:" *";color:var(--danger)}
/* Layout */
.body{display:grid;grid-template-columns:var(--sidebar) 1fr;flex:1;min-height:0;overflow:hidden}
/* Controls panel */
.ctrl{overflow-y:auto;background:var(--bg2);border-right:1px solid var(--border)}
.sec{border-bottom:1px solid var(--border)}
.sec-hdr{height:30px;padding:8px 10px;background:var(--bg3);font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);font-weight:600;user-select:none}
.sec-body{padding:10px;display:flex;flex-direction:column;gap:8px}
/* Fields */
.f{display:flex;align-items:center;gap:7px;min-height:var(--field-h)}
.f label{font-size:11px;color:var(--dim);flex:0 0 96px;white-space:nowrap}
.f input[type=text],.f input[type=number],.f select{min-width:0;flex:1}
.f input:focus,.f select:focus{border-color:var(--accent)}
.f input[type=color]{cursor:pointer;flex-shrink:0}
.f input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:var(--accent);flex-shrink:0}
.f input[type=range]{flex:1}
.f .rv{min-width:34px;text-align:right;font:11px monospace;color:var(--dim)}
.f .chx{width:76px;font:12px 'Segoe UI',system-ui,sans-serif;padding:5px 7px;outline:none;flex-shrink:0}
.f .chx:focus{border-color:var(--accent)}
/* Buttons */
.btn{min-height:var(--field-h);padding:5px 10px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--text);font:var(--fs) 'Segoe UI',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--border)}
.btn-p{background:#30343d;border-color:var(--accent);color:var(--text)}
.btn-p:hover{background:var(--border)}
.btn.tab{height:36px;min-height:36px;padding:9px 16px 7px;border-radius:9px 9px 0 0;background:var(--tab);border-color:var(--border);border-bottom-color:var(--border);color:#a8a8b8}
.btn.tab:hover{background:#23232c}
.btn.tab.active{background:var(--tab-active);border-color:var(--border2);border-bottom-color:var(--tab-active);color:#f3f3f8}
.btn-d{padding:2px 7px;font-size:11px;background:transparent;border-color:var(--danger);color:var(--danger);width:28px;min-width:28px;text-align:center;flex-shrink:0}
.btn-d:hover{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
/* List items (cameos) */
.li{background:var(--bg4);border:1px solid var(--border);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px}
.li-row{display:flex;align-items:center;gap:6px}
.li-row label{font-size:11px;color:var(--dim);flex-shrink:0}
.li-row input,.li-row select{min-width:0}
.li-row input:focus,.li-row select:focus{border-color:var(--accent)}
.li-row input[type=number]{width:60px}
.li-row .spacer{display:none}
.add-row{display:flex;gap:6px;align-items:center;margin-top:2px}
.add-row select{outline:none}
/* Preview panel */
.pv{display:flex;flex-direction:column;overflow:hidden;padding:12px;gap:10px;background:var(--bg)}
.matrix-wrap{display:flex;justify-content:center;flex-shrink:0}
#matrix{display:block;border:1px solid var(--border2);border-radius:3px;image-rendering:pixelated;image-rendering:crisp-edges}
.legend-on #matrix{border-color:var(--accent)}
.pv-ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);flex-shrink:0}
.pv-ctrl .f{flex-shrink:0}
.pv-ctrl .f label{min-width:unset;flex:none}
.pv-ctrl .f input[type=text],.pv-ctrl .f input[type=number]{width:56px}
.json-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:var(--r);min-height:80px}
.json-hdr{display:flex;align-items:center;justify-content:space-between;padding:5px 9px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:11px;color:var(--dim);flex-shrink:0}
.json-actions{display:flex;align-items:center;gap:6px}
#json-status{font-size:11px;color:var(--dim);min-width:86px;text-align:right}
#json-status.err{color:var(--danger)}
#json-status.ok{color:var(--ok)}
#json-out{flex:1;background:var(--bg4);color:#7ab0ff;border:none;padding:9px;font:11px/1.5 Consolas,monospace;resize:none;outline:none;overflow:auto}
/* Scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="hdr">
  <span class="hdr-title">HUB75 Theme Builder</span>
  <div class="hdr-btns">
    <div class="tabs"><button class="btn tab active" type="button">Themes</button><a class="btn tab" href="/sprite-builder.html?mode=sprite">Sprite</a><a class="btn tab" href="/sprite-builder.html?mode=animation">Cameo</a></div>
    <select id="server-theme-select" class="server-only"></select>
    <button class="btn server-only" id="btn-server-new">New</button>
    <button class="btn btn-p server-only" id="btn-server-save">Save</button>
    <button class="btn server-only" id="btn-server-save-as">Save As</button>
    <span id="server-status" class="server-only"></span>
    <label class="btn">
      <input type="file" id="file-load" accept=".json" style="display:none"> Load JSON
    </label>
    <button class="btn btn-p" id="btn-export">Export JSON</button>
    <button class="btn" id="btn-copy">Copy JSON</button>
  </div>
</div>
<div class="body">
<!-- ===== LEFT CONTROLS ===== -->
<div class="ctrl">
  <!-- Identity -->
  <div class="sec" data-help="Theme name and note. Save writes to the current file shown in the header; use Save As to create or rename a theme file." data-highlight="banner">
    <div class="sec-hdr">Identity</div>
    <div class="sec-body">
      <div class="f"><label>Name</label><input type="text" id="i-name" value="My Theme"></div>
      <div class="f"><label>Description</label><input type="text" id="i-desc" placeholder="optional"></div>
    </div>
  </div>
  <!-- Background -->
  <div class="sec" data-help="The animation-zone background behind sun, moon, clouds, stars, and foreground cameos." data-highlight="animation">
    <div class="sec-hdr">Background</div>
    <div class="sec-body">
      <div class="f"><label>Type</label>
        <select id="i-bgtype">
          <option value="solid">solid</option>
          <option value="gradient">gradient</option>
        </select>
      </div>
      <div id="g-solid">
        <div class="f"><label>Color</label>
          <input type="color" id="i-bgcol" value="#000820">
          <input type="text" class="chx" id="i-bgcol-h" value="#000820">
        </div>
      </div>
      <div id="g-grad" class="hidden">
        <div class="f"><label>Top</label>
          <input type="color" id="i-bgtop" value="#0F0019">
          <input type="text" class="chx" id="i-bgtop-h" value="#0F0019">
        </div>
        <div class="f"><label>Bottom</label>
          <input type="color" id="i-bgbot" value="#3C1400">
          <input type="text" class="chx" id="i-bgbot-h" value="#3C1400">
        </div>
        <div class="f"><label>Split</label>
          <input type="range" id="i-bgsplit" min="0" max="1" step="0.01" value="0.5">
          <span class="rv" id="i-bgsplit-v">0.50</span>
        </div>
        <div class="f"><label>Direction</label>
          <select id="i-bgdir">
            <option value="sunset">sunset</option>
            <option value="sunrise">sunrise</option>
          </select>
        </div>
      </div>
    </div>
  </div>
  <!-- Animations -->
  <div class="sec" data-help="Built-in scene elements. Stars and clouds save as cameos; sun and moon are theme flags." data-highlight="scene">
    <div class="sec-hdr">Animations</div>
    <div class="sec-body">
      <div class="f"><label>Stars</label><input type="checkbox" id="i-stars"></div>
      <div class="f"><label>Sun</label><input type="checkbox" id="i-sun" checked></div>
      <div class="f"><label>Moon</label><input type="checkbox" id="i-moon"></div>
      <div class="f"><label>Clouds</label><input type="checkbox" id="i-clouds"></div>
      <div id="g-clouds" class="hidden">
        <div class="f"><label>Density</label>
          <select id="i-cdensity">
            <option value="sparse">sparse (2)</option>
            <option value="medium" selected>medium (3-4)</option>
            <option value="dense">dense (5-6)</option>
          </select>
        </div>
        <div class="f"><label>Speed</label>
          <select id="i-cspeed">
            <option value="slow">slow</option>
            <option value="medium" selected>medium</option>
            <option value="fast">fast</option>
          </select>
        </div>
      </div>
    </div>
  </div>
  <!-- Colors -->
  <div class="sec" data-help="Banner text colors for time, low temperature, high temperature, and condition text." data-highlight="banner">
    <div class="sec-hdr">Colors</div>
    <div class="sec-body">
      <div class="f"><label>Time</label>
        <input type="color" id="c-time" value="#F0F0F0">
        <input type="text" class="chx" id="c-time-h" value="#F0F0F0">
      </div>
      <div class="f"><label>Low Temp</label>
        <input type="color" id="c-low" value="#00CCFF">
        <input type="text" class="chx" id="c-low-h" value="#00CCFF">
      </div>
      <div class="f"><label>High Temp</label>
        <input type="color" id="c-high" value="#FF8C00">
        <input type="text" class="chx" id="c-high-h" value="#FF8C00">
      </div>
      <div class="f"><label>Condition</label>
        <input type="color" id="c-cond" value="#909090">
        <input type="text" class="chx" id="c-cond-h" value="#909090">
      </div>
    </div>
  </div>
  <!-- Cameos -->
  <div class="sec" data-help="Optional animations that can appear over the theme. Preview shows only the core scene and a simple shooting-star representation." data-highlight="animation">
    <div class="sec-hdr">Cameos</div>
    <div class="sec-body">
      <div id="cameo-list"></div>
      <div class="add-row">
        <select id="cameo-add-sel">
          <option value="shooting_star">shooting_star</option>
          <option value="airplane">airplane</option>
          <option value="biplane">biplane</option>
          <option value="bird_flock">bird_flock</option>
          <option value="butterfly">butterfly</option>
          <option value="comet">comet</option>
          <option value="easter_egg">easter_egg</option>
          <option value="firefly">firefly</option>
          <option value="fireworks">fireworks</option>
          <option value="fish">fish</option>
          <option value="flutterflies">flutterflies</option>
          <option value="ghost">ghost</option>
          <option value="hot_air_balloon">hot_air_balloon</option>
          <option value="jack_o_lantern">jack_o_lantern</option>
          <option value="meteor">meteor</option>
          <option value="rainbow">rainbow</option>
          <option value="rocket">rocket</option>
          <option value="santa">santa</option>
          <option value="satellite">satellite</option>
          <option value="snowman">snowman</option>
          <option value="snake">snake</option>
          <option value="sprite">sprite</option>
          <option value="submarine">submarine</option>
          <option value="testPlane">testPlane</option>
          <option value="tractor">tractor</option>
          <option value="tumbleweed">tumbleweed</option>
          <option value="ufo">ufo</option>
        </select>
        <button class="btn btn-sm" id="cameo-add-btn">+ Add Cameo</button>
      </div>
    </div>
  </div>
</div>
<!-- ===== RIGHT PREVIEW ===== -->
<div class="pv">
  <div class="matrix-wrap">
    <canvas id="matrix" width="512" height="256"></canvas>
  </div>
  <div style="text-align:center;font-size:10px;color:var(--dim);margin-top:4px">
    Preview approximates the clock: colors, weather, stars, shooting stars, sun, moon, and clouds are represented; exact BDF font rendering and full cameo sprites are not.
  </div>
  <div class="pv-ctrl">
    <div class="f">
      <label>Condition</label>
      <select id="p-cond">
        <option value="CLEAR">CLEAR</option>
        <option value="PARTLYCLOUDY">PARTLYCLOUDY</option>
        <option value="CLOUDY">CLOUDY</option>
        <option value="SUNNY">SUNNY</option>
        <option value="RAIN">RAIN</option>
        <option value="SNOW">SNOW</option>
        <option value="TSTORM">TSTORM</option>
        <option value="SLEET">SLEET</option>
        <option value="ICE">ICE</option>
      </select>
    </div>
    <div class="f"><label>Night</label><input type="checkbox" id="p-night"></div>
    <div class="f"><label>Low</label><input type="number" id="p-low" value="68"></div>
    <div class="f"><label>High</label><input type="number" id="p-high" value="88"></div>
    <div class="f"><label>Condition text</label><input type="text" id="p-condtext" value="CLEAR" style="width:100px"></div>
    <div class="f"><label>Animate</label><input type="checkbox" id="p-animate"></div>
    <div class="f"><label>Legend</label><input type="checkbox" id="p-legend"></div>
  </div>
  <div class="json-wrap">
    <div class="json-hdr">
      <span>Editable JSON</span>
      <div class="json-actions">
        <span id="json-status">Generated</span>
        <button class="btn btn-sm" id="btn-apply-json">Apply JSON</button>
        <button class="btn btn-sm" id="btn-copy2">Copy</button>
      </div>
    </div>
    <textarea id="json-out" spellcheck="false"></textarea>
  </div>
</div>
</div>
<script>
'use strict';

// =====================================================================
// CONSTANTS
// =====================================================================
const W = 64, H = 32, S = 8;   // matrix dimensions, pixel scale
const BANNER_H = 7;             // rows 0-6 = banner
const ANIM_TOP = 7;             // rows 7-31 = animation zone
const ANIM_BOT = 31;
const ALL_CONDITIONS = ['CLEAR','PARTLYCLOUDY','CLOUDY','SUNNY','RAIN','SNOW','TSTORM','SLEET','ICE'];

// =====================================================================
// THEME STATE
// =====================================================================
const theme = {
  name: 'My Theme', description: '',
  background_type: 'solid', background_color: '#000820',
  background_top: '#0F0019', background_bottom: '#3C1400',
  background_split: 0.5, background_gradient_direction: 'sunset',
  colors: { time: '#F0F0F0', low_temp: '#00CCFF', high_temp: '#FF8C00', condition: '#909090' },
  stars_enabled: false, sun_enabled: true, moon_enabled: false, clouds_enabled: false,
  cloud_density: 'medium', cloud_speed: 'medium',
  cameos: []
};

const preview = { condition: 'CLEAR', nightMode: false, lowTemp: 68, highTemp: 88, condText: 'CLEAR', animate: false };
let previewLegend = false;
let previewHighlight = '';

// =====================================================================
// PIXEL BUFFER
// =====================================================================
const pixbuf = new Uint8ClampedArray(W * H * 3);

function px(x, y, r, g, b) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = (y * W + x) * 3;
  pixbuf[i] = r; pixbuf[i+1] = g; pixbuf[i+2] = b;
}

function addpx(x, y, r, g, b) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = (y * W + x) * 3;
  pixbuf[i]   = Math.min(255, pixbuf[i]   + r);
  pixbuf[i+1] = Math.min(255, pixbuf[i+1] + g);
  pixbuf[i+2] = Math.min(255, pixbuf[i+2] + b);
}

// =====================================================================
// HELPERS
// =====================================================================
function hex2rgb(h) {
  if (!h || h.length < 7) return [0,0,0];
  h = h.replace('#','');
  return [parseInt(h.slice(0,2),16)||0, parseInt(h.slice(2,4),16)||0, parseInt(h.slice(4,6),16)||0];
}

function lerp(a, b, t) { return a + (b - a) * Math.max(0, Math.min(1, t)); }

// =====================================================================
// TEXT RENDERING (offscreen canvas — used only for cameo flash label)
// =====================================================================
const TC = document.createElement('canvas');
TC.width = W; TC.height = H;
const TX = TC.getContext('2d', { willReadFrequently: true });
TX.imageSmoothingEnabled = false;

function drawText(text, x, y, r, g, b, font) {
  TX.clearRect(0, 0, W, H);
  TX.fillStyle = '#000'; TX.fillRect(0, 0, W, H);
  TX.fillStyle = '#fff'; TX.font = font; TX.textBaseline = 'top';
  TX.fillText(text, x, y);
  const d = TX.getImageData(0, 0, W, H).data;
  for (let row = 0; row < H; row++)
    for (let col = 0; col < W; col++)
      if (d[(row * W + col) * 4] > 60) px(col, row, r, g, b);
}

// =====================================================================
// EMBEDDED BITMAP FONTS
// =====================================================================

// 4×6 pixel font — glyph = 6 nibbles (rows), bit3=leftmost pixel
const FONT4X6 = (function() {
  const m = {};
  m[' ']=[0,0,0,0,0,0];    m['!']=[4,4,4,4,0,4];
  m['"']=[10,10,0,0,0,0];  m['#']=[10,15,10,15,10,0];
  m['$']=[7,10,7,5,14,0];  m['%']=[9,2,4,8,9,0];
  m['&']=[4,10,4,11,5,6];  m["'"]=[6,4,0,0,0,0];
  m['(']=[2,4,8,8,4,2];    m[')']=[8,4,2,2,4,8];
  m['*']=[0,5,2,5,0,0];    m['+']=[0,4,14,4,0,0];
  m[',']=[0,0,0,6,4,8];    m['-']=[0,0,15,0,0,0];
  m['.']=[0,0,0,0,6,0];    m['/']=[1,2,2,4,4,8];
  m['0']=[6,9,9,9,9,6];    m['1']=[2,6,2,2,2,7];
  m['2']=[6,9,1,2,4,15];   m['3']=[6,1,3,1,9,6];
  m['4']=[5,9,15,1,1,1];   m['5']=[15,8,14,1,9,6];
  m['6']=[3,8,14,9,9,6];   m['7']=[15,1,2,4,4,4];
  m['8']=[6,9,6,9,9,6];    m['9']=[6,9,9,7,1,6];
  m[':']=[0,6,0,6,0,0];    m[';']=[0,6,0,4,4,8];
  m['<']=[2,4,8,8,4,2];    m['=']=[0,15,0,15,0,0];
  m['>']=[8,4,2,2,4,8];    m['?']=[6,9,2,2,0,2];
  m['@']=[6,9,11,10,8,6];
  m['A']=[6,9,9,15,9,9];   m['B']=[14,9,14,9,9,14];
  m['C']=[6,9,8,8,9,6];    m['D']=[14,9,9,9,9,14];
  m['E']=[15,8,14,8,8,15]; m['F']=[15,8,14,8,8,8];
  m['G']=[6,9,8,11,9,6];   m['H']=[9,9,15,9,9,9];
  m['I']=[6,2,2,2,2,6];    m['J']=[3,1,1,1,9,6];
  m['K']=[9,10,12,10,9,9]; m['L']=[8,8,8,8,8,15];
  m['M']=[9,15,15,9,9,9];  m['N']=[9,13,11,9,9,9];
  m['O']=[6,9,9,9,9,6];    m['P']=[14,9,9,14,8,8];
  m['Q']=[6,9,9,9,5,3];    m['R']=[14,9,9,14,10,9];
  m['S']=[6,9,6,1,9,6];    m['T']=[15,4,4,4,4,4];
  m['U']=[9,9,9,9,9,6];    m['V']=[9,9,9,9,6,4];
  m['W']=[9,9,9,15,15,9];  m['X']=[9,9,6,6,9,9];

function drawChar4x6(ch, cx, cy, r, g, b) {
  const rows = FONT4X6[ch] || FONT4X6['?'] || [15,9,9,9,9,15];
  for (let row = 0; row < 6; row++) {
    const bits = rows[row];
    for (let col = 0; col < 4; col++)
      if (bits & (8 >> col)) px(cx + col, cy + row, r, g, b);
  }
}

function measureStr4x6(text) {
  return text.length ? text.length * 5 - 1 : 0;
}

function drawStr4x6(text, sx, sy, r, g, b) {
  let x = sx;
  for (const ch of text) { drawChar4x6(ch, x, sy, r, g, b); x += 5; }
}

function drawChar12x24(ch, cx, cy, r, g, b) {
  const rows = SPLEEN12X24[ch];
  if (!rows) return;
  for (let row = 0; row < 24; row++) {
    const bits = rows[row];
    for (let col = 0; col < 12; col++)
      if (bits & (0x800 >> col)) px(cx + col, cy + row, r, g, b);
  }
}

function measureStr12x24(text) {
  return text.length ? text.length * 13 - 1 : 0;
}

function drawStr12x24(text, sx, sy, r, g, b) {
  let x = sx;
  for (const ch of text) { drawChar12x24(ch, x, sy, r, g, b); x += 13; }
}

// =====================================================================
// BACKGROUND RENDERING
// =====================================================================
function drawBackground() {
  const bgtype = theme.background_type;
  const bgcol  = theme.background_color;
  const bgtop  = theme.background_top;
  const bgbot  = theme.background_bottom;
  const bgspl  = theme.background_split;
  const bgdir  = theme.background_gradient_direction;

  if (bgtype === 'solid') {
    const [r,g,b] = hex2rgb(bgcol);
    for (let y = ANIM_TOP; y <= ANIM_BOT; y++)
      for (let x = 0; x < W; x++) px(x, y, r, g, b);
  } else {
    const zoneH = ANIM_BOT - ANIM_TOP;
    const splitY = ANIM_TOP + Math.round(bgspl * zoneH);
    const [tr,tg,tb] = hex2rgb(bgtop);
    const [br,bg2,bb] = hex2rgb(bgbot);
    for (let y = ANIM_TOP; y <= ANIM_BOT; y++) {
      let r,g,b;
      if (bgdir === 'sunrise') {
        if (y <= splitY) {
          const t2 = splitY === ANIM_TOP ? 1 : (y - ANIM_TOP) / (splitY - ANIM_TOP);
          r = lerp(tr, br, t2); g = lerp(tg, bg2, t2); b = lerp(tb, bb, t2);
        } else { r = br; g = bg2; b = bb; }
      } else { // sunset
        if (y <= splitY) { r = tr; g = tg; b = tb; }
        else {
          const t2 = ANIM_BOT === splitY ? 1 : (y - splitY) / (ANIM_BOT - splitY);
          r = lerp(tr, br, t2); g = lerp(tg, bg2, t2); b = lerp(tb, bb, t2);
        }
      }
      for (let x = 0; x < W; x++) px(x, y, r|0, g|0, b|0);
    }
  }
}

// =====================================================================
// BANNER — rendered with embedded 4×6 bitmap font
// =====================================================================
function drawBanner() {
  for (let y = 0; y < BANNER_H; y++)
    for (let x = 0; x < W; x++) px(x, y, 4, 4, 9);

  const [lr, lg, lb] = hex2rgb(theme.colors.low_temp  || '#00CCFF');
  const [hr, hg, hb] = hex2rgb(theme.colors.high_temp || '#FF8C00');
  const [cr, cg, cb] = hex2rgb(theme.colors.condition  || '#909090');

  const lo  = String(preview.lowTemp)  + '\xb0';
  const hi  = String(preview.highTemp) + '\xb0';
  const con = preview.condText.toUpperCase();

  const hiW  = measureStr4x6(hi);
  const conW = measureStr4x6(con);

  drawStr4x6(lo,  1,                            0, lr, lg, lb);
  drawStr4x6(hi,  W - hiW - 1,                  0, hr, hg, hb);
  drawStr4x6(con, Math.round((W - conW) / 2),   0, cr, cg, cb);
}

// =====================================================================
// TIME DISPLAY — rendered with embedded Spleen 12×24 bitmap font
// =====================================================================
function drawTime() {
  const now = new Date();
  const h = now.getHours() % 12 || 12;
  const m = String(now.getMinutes()).padStart(2, '0');
  const timeStr = h + ':' + m;
  const [r, g, b] = hex2rgb(theme.colors.time || '#F0F0F0');

  const tw = measureStr12x24(timeStr);
  const tx = Math.max(0, Math.round((W - tw) / 2));
  const zoneH = ANIM_BOT - ANIM_TOP + 1; // 25 rows
  const ty = ANIM_TOP + Math.round((zoneH - 24) / 2);

  drawStr12x24(timeStr, tx, ty, r, g, b);
}

// =====================================================================
// STARS (static positions, twinkle via sin if animated)
// =====================================================================
let stars = [];
let animT = 0;

function initStars() {
  stars = [];
  if (!theme.stars_enabled) return;
  const rng = mulberry32(12345);
  for (let i = 0; i < 35; i++) {
    stars.push({
      x: Math.floor(rng() * W),
      y: ANIM_TOP + Math.floor(rng() * (ANIM_BOT - ANIM_TOP + 1)),
      phase: rng() * Math.PI * 2,
      speed: 0.03 + rng() * 0.04,
      maxB: 80 + Math.floor(rng() * 120)
    });
  }
}

function drawStars() {
  if (!theme.stars_enabled) return;
  for (const s of stars) {
    const level = (Math.sin(s.phase + animT * s.speed) + 1) / 2;
    const b = Math.round(s.maxB * level);
    if (b > 5) px(s.x, s.y, b, b, b);
  }
}

// Deterministic seeded PRNG (mulberry32)
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let z = Math.imul(seed ^ seed >>> 15, 1 | seed);
    z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z;
    return ((z ^ z >>> 14) >>> 0) / 4294967296;
  };
}

// =====================================================================
// CLOUDS
// =====================================================================
let clouds = [];

function initClouds() {
  clouds = [];
  if (!theme.clouds_enabled) return;
  const counts = { sparse: 2, medium: 3, dense: 5 };
  const count = counts[theme.cloud_density] || 3;
  const rng = mulberry32(99887);
  for (let i = 0; i < count; i++) {
    clouds.push({
      x: rng() * W,
      y: ANIM_TOP + 2 + rng() * 10,
      w: 9 + rng() * 10,
      h: 3 + rng() * 3,
      b: 50 + Math.floor(rng() * 60)
    });
  }
}

function drawClouds() {
  if (!theme.clouds_enabled) return;
  for (const c of clouds) {
    const hw = c.w / 2, hh = c.h / 2;
    for (let dy = 0; dy <= c.h; dy++) {
      for (let dx = 0; dx <= c.w; dx++) {
        const nx = (dx / c.w - 0.5) * 2;
        const ny = (dy / c.h - 0.5) * 2;
        const d = nx*nx + ny*ny;
        if (d < 1) {
          const cx = Math.round(c.x + dx - hw);
          const cy = Math.round(c.y + dy - hh);
          const bright = Math.round(c.b * (1 - d * 0.4));
          addpx(cx, cy, bright, bright, bright);
        }
      }
    }
  }
}

function updateClouds() {
  if (!theme.clouds_enabled || !preview.animate) return;
  const speeds = { slow: 0.06, medium: 0.13, fast: 0.22 };
  const spd = speeds[theme.cloud_speed] || 0.13;
  for (const c of clouds) {
    c.x += spd;
    if (c.x > W + 10) c.x = -10 - c.w;
  }
}

// =====================================================================
// SUN / MOON
// =====================================================================
function drawSun() {
  const cond = preview.condition;
  if (!theme.sun_enabled || preview.nightMode) return;
  if (cond !== 'SUNNY' && cond !== 'CLEAR') return;
  const radius = 10;
  const cx = W;     // right edge
  const cy = ANIM_TOP; // top of animation zone
  for (let y = ANIM_TOP; y < ANIM_TOP + radius; y++) {
    for (let x = W - radius; x < W; x++) {
      const dx = x - cx, dy = y - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < radius) {
        const t = 1 - dist / radius;
        const r2 = Math.round(255 * t);
        const g2 = Math.round(200 * t);
        const b2 = Math.round(60 * t);
        addpx(x, y, r2, g2, b2);
      }
    }
  }
}

function drawMoon() {
  if (!theme.moon_enabled) return;
  const cx = 3;
  const cy = ANIM_TOP + 3;
  const radius = 3;
  const glowR = 5;
  const sky = theme.background_type === 'solid' ? hex2rgb(theme.background_color) : [0, 0, 8];

  for (let dy = -glowR; dy <= glowR; dy++) {
    for (let dx = -glowR; dx <= glowR; dx++) {
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (radius < dist && dist <= glowR) {
        const fade = 1.0 - (dist - radius) / (glowR - radius);
        const mix = fade * 0.4;
        addpx(
          cx + dx, cy + dy,
          Math.round(200 * mix + sky[0] * (1 - mix)),
          Math.round(200 * mix + sky[1] * (1 - mix)),
          Math.round(160 * fade * 0.3 + sky[2] * (1 - fade * 0.3))
        );
      }
    }
  }

  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      if (dx * dx + dy * dy <= radius * radius) {
        let shade = 180 + ((dx * 13 + dy * 7) % 40) - 20;
        if ((dx === -1 && dy === -1) || (dx === 1 && dy === 1)) shade = 120;
        shade = Math.max(80, Math.min(220, shade));
        px(cx + dx, cy + dy, shade, shade, Math.round(shade * 0.85));
      }
    }
  }
}

// =====================================================================
// SHOOTING STARS
// =====================================================================
let shootingStars = [];

function updateShootingStars() {
  const ss = theme.cameos.find(c => c.name === 'shooting_star');
  if (!ss) { shootingStars = []; return; }
  const cond = preview.condition;
  if (cond !== 'CLEAR' && cond !== 'PARTLYCLOUDY') { shootingStars = []; return; }
  const prob = (ss.chance_per_minute || 8) / 60 / 15;
  if (shootingStars.length === 0 && Math.random() < prob) {
    const speed = (0.8 + Math.random() * 1.5) * (Math.random() < 0.5 ? 1 : -1);
    const life = 10 + Math.floor(Math.random() * 8);
    shootingStars.push({
      x: Math.random() * W, y: ANIM_TOP + Math.random() * 6,
      vx: speed, vy: 0.6 + Math.random() * 0.8,
      life, maxLife: life
    });
  }
  for (const s of shootingStars) { s.x += s.vx; s.y += s.vy; s.life--; }
  shootingStars = shootingStars.filter(s => s.life > 0);
}

function drawShootingStars() {
  for (const s of shootingStars) {
    const bright = Math.round(220 * s.life / s.maxLife);
    px(s.x|0, s.y|0, bright, bright, bright);
    for (let i = 1; i < 6; i++) {
      const tb = Math.round(bright * (1 - i / 5));
      if (tb > 5) px((s.x - s.vx*i)|0, (s.y - s.vy*i)|0, tb, tb, tb);
    }
  }
}

// =====================================================================
// FLUSH PIXEL BUFFER TO CANVAS
// =====================================================================
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

function flushCanvas() {
  ctx.fillStyle = '#070710';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 3;
      const r = pixbuf[i], g = pixbuf[i+1], b = pixbuf[i+2];
      const bright = Math.max(r, g, b);
      const px2 = x * S, py = y * S;

      if (bright < 6) {
        ctx.fillStyle = 'rgb(9,9,13)';
        ctx.fillRect(px2+1, py+1, S-2, S-2);
      } else {
        ctx.shadowBlur = 7;
        ctx.shadowColor = `rgba(${r},${g},${b},.65)`;
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(px2+1, py+1, S-2, S-2);
        ctx.shadowBlur = 0;
      }
    }
  }

  // Banner/animation separator line
  ctx.fillStyle = 'rgba(60,60,100,.4)';
  ctx.fillRect(0, BANNER_H * S, W * S, 1);

  drawPreviewOverlay();
}

function overlayBox(x, y, w, h, label, color, active = true) {
  ctx.save();
  ctx.lineWidth = active ? 2 : 1;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.globalAlpha = active ? 0.95 : 0.38;
  ctx.strokeRect(x * S + 1, y * S + 1, w * S - 2, h * S - 2);
  ctx.font = '10px Segoe UI, sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText(label, x * S + 4, y * S + 3);
  ctx.restore();
}

function drawPreviewOverlay() {
  if (!previewLegend && !previewHighlight) return;
  const showAll = previewLegend;
  const want = key => showAll || previewHighlight === key || (previewHighlight === 'scene' && ['sun','moon','clouds'].includes(key));
  if (want('banner')) overlayBox(0, 0, W, BANNER_H, 'banner', '#4a80ff', previewHighlight === 'banner' || showAll);
  if (want('animation')) overlayBox(0, ANIM_TOP, W, ANIM_BOT - ANIM_TOP + 1, 'animation', '#66c080', previewHighlight === 'animation' || showAll);
  if (want('sun')) overlayBox(W - 21, ANIM_TOP, 21, 21, 'sun', '#ffaa33', previewHighlight === 'scene' || showAll);
  if (want('moon')) overlayBox(0, ANIM_TOP, 10, 10, 'moon', '#d8d8c8', previewHighlight === 'scene' || showAll);
  if (want('clouds')) overlayBox(0, ANIM_TOP + 4, W, 13, 'clouds', '#a0a0b8', previewHighlight === 'scene' || showAll);
}

// =====================================================================
// MAIN RENDER
// =====================================================================
function render() {
  pixbuf.fill(0);
  drawBackground();
  drawStars();
  drawShootingStars();
  drawSun();
  drawMoon();
  drawClouds();
  drawBanner();
  drawTime();
  flushCanvas();
}

// =====================================================================
// ANIMATION LOOP
// =====================================================================
let animRAF = null;
let lastFrame = 0;

function animLoop(ts) {
  if (!preview.animate) return;
  animRAF = requestAnimationFrame(animLoop);
  if (ts - lastFrame < 66) return; // ~15 fps
  lastFrame = ts;
  animT++;
  updateClouds();
  if (theme.cameos.some(c => c.name === 'shooting_star')) updateShootingStars();
  render();
}

function startAnim() {
  if (animRAF) return;
  lastFrame = 0;
  animRAF = requestAnimationFrame(animLoop);
}

function stopAnim() {
  if (animRAF) { cancelAnimationFrame(animRAF); animRAF = null; }
}

// =====================================================================
// JSON OUTPUT
// =====================================================================
function buildThemeObject() {
  const cameoOut = [];
  if (theme.stars_enabled) cameoOut.push({ name: 'stars' });
  for (const c of theme.cameos) {
    if (c.name === 'stars' || c.name === 'clouds') continue;
    if (c.name === 'snake') cameoOut.push({ name: c.name });
    else cameoOut.push({ name: c.name, chance_per_minute: c.chance_per_minute });
  }
  if (theme.clouds_enabled) cameoOut.push({ name: 'clouds' });

  const out = {
    name: theme.name,
    description: theme.description,
    background_type: theme.background_type,
    background_color: theme.background_color,
    background_top: theme.background_top,
    background_bottom: theme.background_bottom,
    background_split: theme.background_split,
    background_gradient_direction: theme.background_gradient_direction,
    colors: { ...theme.colors },
    sun_enabled: theme.sun_enabled,
    moon_enabled: theme.moon_enabled,
    cloud_density: theme.cloud_density,
    cloud_speed: theme.cloud_speed,
    cameos: cameoOut
  };
  return out;
}

function buildJSON() {
  return JSON.stringify(buildThemeObject(), null, 2);
}

function themeFileName() {
  const base = (theme.name || 'theme').trim() || 'theme';
  return base.replace(/[<>:"/\\|?*\x00-\x1f]+/g, '_') + '.json';
}

function normalizeThemeFileName(name) {
  const cleaned = (name || '').trim().replace(/[<>:"/\\|?*\x00-\x1f]+/g, '_');
  if (!cleaned) return '';
  return cleaned.toLowerCase().endsWith('.json') ? cleaned : cleaned + '.json';
}

  const el = document.getElementById('server-status');

}

function currentSaveLabel(prefix = 'File') {
  const file = currentThemeFile || themeFileName();
  setServerStatus(`${prefix}: ${file}`);
}

  themeDirty = false;
  updateJSON(false);
  jsonDirty = false;
  document.body.classList.remove('dirty');
  setJSONStatus('Saved', 'ok');
}

function hasUnsavedChanges() {
  return themeDirty || jsonDirty;
}

function parseJSONEditor() {
  const text = document.getElementById('json-out').value;
  try {
    const data = JSON.parse(text);
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      throw new Error('Theme JSON must be an object');
    }
    setJSONStatus(jsonDirty ? 'Valid edit' : 'Generated', jsonDirty ? 'ok' : '');
    return data;
  } catch (err) {
    setJSONStatus(err.message, 'err');
    return null;
  }
}

function applyJSONEditor(markDirty = true) {
  const data = parseJSONEditor();
  if (!data) return false;
  applyThemeData(data, markDirty);
  setJSONStatus('Applied', 'ok');
  return true;
}

function applyJSONIfDirty() {
  return !jsonDirty || applyJSONEditor();
}

async function refreshServerThemes(selectFile = currentThemeFile) {
  const res = await fetch('/api/themes', { cache: 'no-store' });
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.error || 'Unable to list themes');
  const sel = document.getElementById('server-theme-select');
  sel.innerHTML = '';
  for (const file of data.themes) {
    const opt = document.createElement('option');
    opt.value = file;
    opt.textContent = file;
    sel.appendChild(opt);
  }
  if (selectFile && data.themes.includes(selectFile)) sel.value = selectFile;
  else if (data.themes.length) sel.value = data.themes[0];
  selectedThemeFile = sel.value || '';
  if (currentThemeFile) currentSaveLabel();
  else setServerStatus(data.themes.length ? `${data.themes.length} themes` : 'No themes');
}

async function initServerMode() {
  try {
    await refreshServerThemes('');
    serverMode = true;
    document.body.classList.add('server-mode');
    if (document.getElementById('server-theme-select').value) {
      setServerStatus('Select a theme');
    }
  } catch (err) {
    serverMode = false;
  }
}

async function loadServerTheme(file) {
  const selected = file || document.getElementById('server-theme-select').value;
  if (!selected) return;
  setServerStatus('Loading...');
  try {
    const res = await fetch('/api/theme?file=' + encodeURIComponent(selected), { cache: 'no-store' });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Unable to load theme');
    applyThemeData(data.theme, false);
    currentThemeFile = data.file;
    selectedThemeFile = data.file;
    document.getElementById('server-theme-select').value = data.file;
    currentSaveLabel('Loaded');
  } catch (err) {
    setServerStatus('Load failed');
    alert('Load failed: ' + err.message);
  }
}

async function saveServerTheme(fileOverride = '') {
  if (!serverMode) return;
  if (!applyJSONIfDirty()) {
    alert('Fix the JSON before saving.');
    return;
  }
  const file = fileOverride || currentThemeFile || themeFileName();
  const impliedFile = themeFileName();
  if (!fileOverride && currentThemeFile && currentThemeFile !== impliedFile) {
    const ok = confirm(`Save writes to the loaded file:\n\n${currentThemeFile}\n\nThe theme name suggests:\n\n${impliedFile}\n\nUse Save As if you meant to create/rename the file. Save to ${currentThemeFile}?`);
    if (!ok) {
      currentSaveLabel('Still loaded');
      return;
    }
  }
  setServerStatus('Saving...');
  try {
    const res = await fetch('/api/theme', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file, theme: buildThemeObject() })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Unable to save theme');
    currentThemeFile = data.file;
    selectedThemeFile = data.file;
    await refreshServerThemes(currentThemeFile);
    markThemeSaved();
    const savedTo = Array.isArray(data.saved_to) && data.saved_to.length
      ? `Saved to ${data.saved_to.join(', ')}`
      : `Saved ${data.file}`;
    setServerStatus(savedTo);
  } catch (err) {
    setServerStatus('Save failed');
    alert('Save failed: ' + err.message);
  }
}

async function saveServerThemeAs() {
  if (!serverMode) return;
  const defaultName = currentThemeFile || themeFileName();
  const entered = prompt('Save theme as:', defaultName);
  if (entered === null) return;
  const file = normalizeThemeFileName(entered);
  if (!file) {
    alert('Please enter a theme filename.');
    return;
  }
  await saveServerTheme(file);
}

function makeBlankTheme(name = 'New Theme') {
  return {
    name,
    description: '',
    background_type: 'solid',
    background_color: '#000000',
    background_top: '#000000',
    background_bottom: '#000000',
    background_split: 0.5,
    background_gradient_direction: 'sunset',
    colors: {
      time: '#F0F0F0',
      low_temp: '#00CCFF',
      high_temp: '#FF8C00',
      condition: '#909090'
    },
    sun_enabled: false,
    moon_enabled: false,
    cloud_density: 'medium',
    cloud_speed: 'medium',
    cameos: []
  };
}

function newServerTheme() {
  if (hasUnsavedChanges() && !confirm('Discard unsaved changes and start a new theme?')) return;
  const entered = prompt('New theme name:', 'New Theme');
  if (entered === null) return;
  const name = entered.trim() || 'New Theme';
  currentThemeFile = '';
  selectedThemeFile = '';
  const sel = document.getElementById('server-theme-select');
  if (sel) sel.selectedIndex = -1;
  applyThemeData(makeBlankTheme(name), true);
  setServerStatus('New unsaved theme');
}

function updateJSON(markDirty = true) {
  if (markDirty) themeDirty = true;
  syncingJSON = true;
  document.getElementById('json-out').value = buildJSON();
  syncingJSON = false;
  jsonDirty = false;
  setThemeDirty(themeDirty);
  setJSONStatus('Generated');
}

// =====================================================================
// EXPORT / IMPORT
// =====================================================================
function exportJSON() {
  if (!applyJSONIfDirty()) {
    alert('Fix the JSON before exporting.');
    return;
  }
  const json = buildJSON();
  const fname = (theme.name || 'theme').toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.json';
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function copyJSON() {
  const text = document.getElementById('json-out').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => flashBtn('btn-copy', 'Copied!'));
  } else {
    const t = document.getElementById('json-out');
    t.select(); document.execCommand('copy');
    flashBtn('btn-copy', 'Copied!');
  }
}

function flashBtn(id, msg) {
  const btn = document.getElementById(id);
  const orig = btn.textContent;
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = orig; }, 1200);
}

function loadFile(file) {
  if (!file) return;
  currentThemeFile = file.name || '';
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      applyThemeData(data, false);
    } catch(err) { alert('Invalid JSON: ' + err.message); }
  };
  reader.readAsText(file);
}

function applyThemeData(data, markDirty = false) {
  const incomingCameos = Array.isArray(data.cameos) ? data.cameos : [];
  const defaults = {
    name: 'Imported', description: '',
    background_type: 'solid', background_color: '#000820',
    background_top: '#0F0019', background_bottom: '#3C1400',
    background_split: 0.5, background_gradient_direction: 'sunset',
    colors: {}, stars_enabled: false, sun_enabled: true, moon_enabled: false,
    clouds_enabled: false, cloud_density: 'medium', cloud_speed: 'medium',
    cameos: []
  };
  Object.assign(theme, defaults);
  for (const k of Object.keys(defaults)) {
    if (k === 'colors') {
      if (data.colors) Object.assign(theme.colors, data.colors);
    } else if (k === 'cameos') {
      theme.cameos = uniqueCameos(incomingCameos
        .filter(c => c.name !== 'stars' && c.name !== 'clouds')
        .map(c => ({...c})));
    } else if (data[k] !== undefined) {
      theme[k] = data[k];
    }
  }
  theme.stars_enabled = !!data.stars_enabled || incomingCameos.some(c => c.name === 'stars');
  theme.clouds_enabled = !!data.clouds_enabled || incomingCameos.some(c => c.name === 'clouds');
  // backward compat: shooting_stars_enabled → cameo
  if (data.shooting_stars_enabled && !theme.cameos.some(c => c.name === 'shooting_star')) {
    theme.cameos.push({ name: 'shooting_star', chance_per_minute: 8 });
  }
  theme.cameos = uniqueCameos(theme.cameos);
  syncFormToTheme();
  initStars(); initClouds();
  render(); updateJSON(markDirty);
  setThemeDirty(markDirty);
}

// =====================================================================
// FORM → THEME SYNC
// =====================================================================
function syncFormToTheme() {
  setVal('i-name', theme.name);
  setVal('i-desc', theme.description);
  setVal('i-bgtype', theme.background_type);
  setColorPair('i-bgcol', 'i-bgcol-h', theme.background_color);
  setColorPair('i-bgtop', 'i-bgtop-h', theme.background_top);
  setColorPair('i-bgbot', 'i-bgbot-h', theme.background_bottom);
  document.getElementById('i-bgsplit').value = theme.background_split;
  document.getElementById('i-bgsplit-v').textContent = theme.background_split.toFixed(2);
  setVal('i-bgdir', theme.background_gradient_direction);
  document.getElementById('i-stars').checked = theme.stars_enabled;
  document.getElementById('i-sun').checked = theme.sun_enabled;
  document.getElementById('i-moon').checked = theme.moon_enabled;
  document.getElementById('i-clouds').checked = theme.clouds_enabled;
  setVal('i-cdensity', theme.cloud_density);
  setVal('i-cspeed', theme.cloud_speed);
  setColorPair('c-time', 'c-time-h', theme.colors.time || '#F0F0F0');
  setColorPair('c-low', 'c-low-h', theme.colors.low_temp || '#00CCFF');
  setColorPair('c-high', 'c-high-h', theme.colors.high_temp || '#FF8C00');
  setColorPair('c-cond', 'c-cond-h', theme.colors.condition || '#909090');
  showHideBgGroups();
  showHideCloudOptions();
  buildCameoList();
}

function setVal(id, val) {
  const el = document.getElementById(id);
  if (el) el.value = val;
}

function setColorPair(pickId, hexId, val) {
  const pick = document.getElementById(pickId);
  const hex = document.getElementById(hexId);
  if (pick) pick.value = normalizeHex(val);
  if (hex) hex.value = normalizeHex(val);
}

function normalizeHex(h) {
  if (!h) return '#000000';
  h = h.replace('#','');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return '#' + h.padEnd(6,'0').slice(0,6).toLowerCase();
}

// =====================================================================
// SHOW / HIDE CONDITIONAL GROUPS
// =====================================================================
function showHideBgGroups() {
  const grad = theme.background_type === 'gradient';
  document.getElementById('g-solid').classList.toggle('hidden', grad);
  document.getElementById('g-grad').classList.toggle('hidden', !grad);
}

function showHideCloudOptions() {
  document.getElementById('g-clouds').classList.toggle('hidden', !theme.clouds_enabled);
}

// =====================================================================
// CAMEO LIST
// =====================================================================
const ALL_ANIMATIONS = [
  'shooting_star','airplane','biplane','bird_flock','butterfly','comet',
  'easter_egg','firefly','fireworks','fish','flutterflies','ghost','hot_air_balloon',
  'jack_o_lantern','meteor','rainbow','rocket','santa','satellite',
  'snowman','snake','sprite','submarine','testPlane','tractor','tumbleweed','ufo'
];

function buildCameoList() {
  const list = document.getElementById('cameo-list');
  list.innerHTML = '';
  theme.cameos.forEach((c, idx) => {
    const opts = ALL_ANIMATIONS.map(n =>
      `<option value="${n}"${c.name===n?' selected':''}${cameoExists(n, idx)?' disabled':''}>${n}</option>`
    ).join('');
    const li = document.createElement('div');
    li.className = 'li';
    li.innerHTML = `<div class="li-row">
      <label>Name</label>
      <select data-ci="${idx}" data-f="name">${opts}</select>
      <span class="spacer"></span>
      <label>Rate/min</label>
      <input type="number" data-ci="${idx}" data-f="cpm" value="${c.chance_per_minute||8}" min="0.1" max="60" step="0.1" style="width:58px">
      <button class="btn btn-d" data-ci="${idx}" data-f="del">x</button>
    </div>`;
    list.appendChild(li);
  });

  list.querySelectorAll('[data-ci][data-f="del"]').forEach(el => {
    el.addEventListener('click', cameoFieldChange);
  });
  list.querySelectorAll('[data-ci]:not([data-f="del"])').forEach(el => {
    el.addEventListener('change', cameoFieldChange);
    el.addEventListener('input', cameoFieldChange);
  });
  updateCameoAddOptions();
}

function cameoExists(name, exceptIdx = -1) {
  return theme.cameos.some((c, idx) => idx !== exceptIdx && c.name === name);
}

function uniqueCameos(cameos) {
  const seen = new Set();
  return cameos.filter(c => {
    if (!c.name || seen.has(c.name)) return false;
    seen.add(c.name);
    return true;
  });
}

function updateCameoAddOptions() {
  const sel = document.getElementById('cameo-add-sel');
  if (!sel) return;
  const used = new Set(theme.cameos.map(c => c.name));
  let firstAvailable = '';
  [...sel.options].forEach(opt => {
    opt.disabled = used.has(opt.value);
    if (!opt.disabled && !firstAvailable) firstAvailable = opt.value;
  });
  if (sel.value && !used.has(sel.value)) return;
  sel.value = firstAvailable;
}

function cameoFieldChange(e) {
  const idx = +e.target.dataset.ci;
  const field = e.target.dataset.f;
  if (field === 'del') { theme.cameos.splice(idx, 1); buildCameoList(); }
  else if (field === 'name') {
    if (cameoExists(e.target.value, idx)) {
      alert(`${e.target.value} is already in this theme.`);
      e.target.value = theme.cameos[idx].name;
      return;
    }
    theme.cameos[idx].name = e.target.value;
    buildCameoList();
  }
  else if (field === 'cpm') { theme.cameos[idx].chance_per_minute = parseFloat(e.target.value) || 8; }
  render(); updateJSON();
}

// =====================================================================
// COLOR PAIR WIRING
// =====================================================================
function wireColorPair(pickId, hexId, setter) {
  const pick = document.getElementById(pickId);
  const hex = document.getElementById(hexId);
  pick.addEventListener('input', () => { hex.value = pick.value; setter(pick.value); });
  hex.addEventListener('input', () => {
    if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) { pick.value = hex.value; setter(hex.value); }
  });
}

// =====================================================================
// WIRE ALL FORM CONTROLS
// =====================================================================
function wireControls() {
  // Identity
  document.getElementById('i-name').addEventListener('input', e => {
    theme.name = e.target.value; updateJSON();
  });
  document.getElementById('i-desc').addEventListener('input', e => {
    theme.description = e.target.value; updateJSON();
  });

  // Background type
  document.getElementById('i-bgtype').addEventListener('change', e => {
    theme.background_type = e.target.value;
    showHideBgGroups(); render(); updateJSON();
  });

  // Background color pickers
  wireColorPair('i-bgcol', 'i-bgcol-h', v => { theme.background_color = v; render(); updateJSON(); });
  wireColorPair('i-bgtop', 'i-bgtop-h', v => { theme.background_top = v; render(); updateJSON(); });
  wireColorPair('i-bgbot', 'i-bgbot-h', v => { theme.background_bottom = v; render(); updateJSON(); });

  // Gradient split
  const splitEl = document.getElementById('i-bgsplit');
  const splitVal = document.getElementById('i-bgsplit-v');
  splitEl.addEventListener('input', () => {
    theme.background_split = parseFloat(splitEl.value);
    splitVal.textContent = theme.background_split.toFixed(2);
    render(); updateJSON();
  });

  document.getElementById('i-bgdir').addEventListener('change', e => {
    theme.background_gradient_direction = e.target.value; render(); updateJSON();
  });

  // Animations
  document.getElementById('i-stars').addEventListener('change', e => {
    theme.stars_enabled = e.target.checked; initStars(); render(); updateJSON();
  });
  document.getElementById('i-sun').addEventListener('change', e => {
    theme.sun_enabled = e.target.checked; render(); updateJSON();
  });
  document.getElementById('i-moon').addEventListener('change', e => {
    theme.moon_enabled = e.target.checked; render(); updateJSON();
  });
  document.getElementById('i-clouds').addEventListener('change', e => {
    theme.clouds_enabled = e.target.checked;
    showHideCloudOptions(); initClouds(); render(); updateJSON();
  });
  document.getElementById('i-cdensity').addEventListener('change', e => {
    theme.cloud_density = e.target.value; initClouds(); render(); updateJSON();
  });
  document.getElementById('i-cspeed').addEventListener('change', e => {
    theme.cloud_speed = e.target.value; updateJSON();
  });

  // Colors
  wireColorPair('c-time', 'c-time-h', v => { theme.colors.time = v; render(); updateJSON(); });
  wireColorPair('c-low', 'c-low-h', v => { theme.colors.low_temp = v; render(); updateJSON(); });
  wireColorPair('c-high', 'c-high-h', v => { theme.colors.high_temp = v; render(); updateJSON(); });
  wireColorPair('c-cond', 'c-cond-h', v => { theme.colors.condition = v; render(); updateJSON(); });

  // Cameos
  document.getElementById('cameo-add-btn').addEventListener('click', () => {
    const name = document.getElementById('cameo-add-sel').value;
    if (!name) return;
    if (cameoExists(name)) {
      alert(`${name} is already in this theme.`);
      updateCameoAddOptions();
      return;
    }
    theme.cameos.push({ name, chance_per_minute: 8 });
    buildCameoList(); render(); updateJSON();
  });

  // Preview controls
  document.getElementById('p-cond').addEventListener('change', e => {
    preview.condition = e.target.value;
    document.getElementById('p-condtext').value = e.target.value;
    preview.condText = e.target.value;
    render();
  });
  document.getElementById('p-night').addEventListener('change', e => {
    preview.nightMode = e.target.checked; render();
  });
  document.getElementById('p-low').addEventListener('input', e => {
    preview.lowTemp = parseInt(e.target.value) || 0; render();
  });
  document.getElementById('p-high').addEventListener('input', e => {
    preview.highTemp = parseInt(e.target.value) || 0; render();
  });
  document.getElementById('p-condtext').addEventListener('input', e => {
    preview.condText = e.target.value.toUpperCase(); render();
  });
  document.getElementById('p-animate').addEventListener('change', e => {
    preview.animate = e.target.checked;
    if (preview.animate) startAnim(); else { stopAnim(); render(); }
  });
  document.getElementById('p-legend').addEventListener('change', e => {
    previewLegend = e.target.checked;
    document.body.classList.toggle('legend-on', previewLegend);
    render();
  });

  // Export / copy
  document.getElementById('btn-server-new').addEventListener('click', newServerTheme);
  document.getElementById('btn-server-save').addEventListener('click', () => saveServerTheme());
  document.getElementById('btn-server-save-as').addEventListener('click', saveServerThemeAs);
  document.getElementById('server-theme-select').addEventListener('change', async e => {
    const nextFile = e.target.value;
    if (!nextFile) return;
    if (hasUnsavedChanges() && !confirm('Discard unsaved changes and load another theme?')) {
      if (selectedThemeFile) e.target.value = selectedThemeFile;
      else e.target.selectedIndex = -1;
      return;
    }
    await loadServerTheme(nextFile);
  });
  document.getElementById('btn-export').addEventListener('click', exportJSON);
  document.getElementById('btn-copy').addEventListener('click', copyJSON);
  document.getElementById('btn-copy2').addEventListener('click', () => {
    const text = document.getElementById('json-out').value;
    navigator.clipboard ? navigator.clipboard.writeText(text).then(() => flashBtn('btn-copy2','Copied!'))
      : (() => { document.getElementById('json-out').select(); document.execCommand('copy'); flashBtn('btn-copy2','Copied!'); })();
  });
  document.getElementById('btn-apply-json').addEventListener('click', () => {
    if (!applyJSONEditor()) alert('Fix the JSON before applying it.');
  });
  document.getElementById('json-out').addEventListener('input', () => {
    if (syncingJSON) return;
    jsonDirty = true;
    setThemeDirty(themeDirty);
    parseJSONEditor();
  });
  document.getElementById('file-load').addEventListener('change', e => {
    loadFile(e.target.files[0]);
    e.target.value = '';
  });
}

function wireHelpTitles() {
  document.querySelectorAll('[data-help]').forEach(el => {
    el.title = el.dataset.help;
    el.addEventListener('mouseenter', () => {
      previewHighlight = el.dataset.highlight || '';
      render();
    });
    el.addEventListener('mouseleave', () => {
      previewHighlight = '';
      render();
    });
  });

  const help = {
    'i-name': 'Displayed theme name. New unsaved themes use this to suggest a filename.',
    'i-desc': 'Optional note stored in the JSON for humans.',
    'i-bgtype': 'Solid uses one color; gradient blends top to bottom in the animation zone.',
    'i-stars': 'Adds the persistent stars cameo.',
    'i-sun': 'Draws the sun before clouds.',
    'i-moon': 'Draws the moon before clouds.',
    'i-clouds': 'Adds the persistent clouds cameo.',
    'c-time': 'Clock time color.',
    'c-low': 'Low temperature color.',
    'c-high': 'High temperature and degree-symbol color.',
    'c-cond': 'Weather condition text color.',
    'p-legend': 'Shows labeled preview regions.'
  };
  for (const [id, text] of Object.entries(help)) {
    const el = document.getElementById(id);
    if (el) el.title = text;
  }
}

// =====================================================================
// INIT
// =====================================================================
function init() {
  wireControls();
  wireHelpTitles();
  showHideBgGroups();
  showHideCloudOptions();
  buildCameoList();
  initStars();
  initClouds();
  render();
  updateJSON(false);
  initServerMode();

  // Live time update every 10 seconds when not animating
  setInterval(() => { if (!preview.animate) render(); }, 10000);
}

init();
</script>
